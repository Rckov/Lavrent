[package]
name = "lavret-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello_hybrid = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "3a5fdb3874ff52acac6f2eecedfbb13886f77194", default-features = false, features = ["system-fonts", "complex-scripts", "svg", "woff", "text-transform-icu", "floats", "writing-mode", "scrollbars"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "3a5fdb3874ff52acac6f2eecedfbb13886f77194", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "3a5fdb3874ff52acac6f2eecedfbb13886f77194", default-features = false, features = ["svg", "scrollbars"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "3a5fdb3874ff52acac6f2eecedfbb13886f77194", default-features = false }
pollster = "=0.4.0"
vello_gpu = { git = "https://github.com/DioxusLabs/vello", rev = "ccdad69675882f5b75a2a365027c6febabacb5cc" }
wgpu = "=30.0.1"
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }

[patch.crates-io]
glifo = { git = "https://github.com/DioxusLabs/vello", rev = "ccdad69675882f5b75a2a365027c6febabacb5cc" }
vello_common = { git = "https://github.com/DioxusLabs/vello", rev = "ccdad69675882f5b75a2a365027c6febabacb5cc" }
vello_gpu = { git = "https://github.com/DioxusLabs/vello", rev = "ccdad69675882f5b75a2a365027c6febabacb5cc" }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"
